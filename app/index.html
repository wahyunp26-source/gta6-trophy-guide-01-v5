<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida 100% — GTA 6 Trophy Guide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Leonida 100%</h1>
    <p class="sub">GTA 6 trophy guide — all 55 trophies, every step cited, every disagreement shown.</p>
  </div>
  <div class="progress-wrap">
    <p id="progress">0 of 55 earned</p>
    <div class="bar"><div id="barfill"></div></div>
  </div>
</header>
<section id="audit" class="audit" aria-label="Audit"></section>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="tracker" class="on">Tracker</button>
  <button type="button" data-tab="roadmap">Roadmap</button>
  <button type="button" data-tab="missables">Missables</button>
  <button type="button" data-tab="sources">Sources</button>
</nav>
<section id="tab-tracker" class="tab on">
  <div class="controls">
    <input id="q" type="search" placeholder="Search trophies…" aria-label="Search trophies">
    <select id="grade" aria-label="Grade filter">
      <option value="all">All grades</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
    <select id="kind" aria-label="Type filter">
      <option value="all">All types</option>
      <option value="story">Story</option>
      <option value="side">Side strands</option>
      <option value="collectible">Collectibles</option>
      <option value="activity">Activities</option>
      <option value="crime">Crime</option>
      <option value="partner">Partner</option>
      <option value="misc">Misc</option>
      <option value="exploration">Exploration</option>
      <option value="platinum">Platinum</option>
      <option value="completion">100% completion</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-missable"> Missable</label>
    <label class="chk"><input type="checkbox" id="f-disputed"> Disputed</label>
    <label class="chk"><input type="checkbox" id="f-watch"> Watch</label>
    <label class="chk"><input type="checkbox" id="f-hidden"> PSN-hidden</label>
    <label class="chk"><input type="checkbox" id="f-notearned"> Not earned</label>
    <label class="chk"><input type="checkbox" id="spoiler" checked> Hide spoilers</label>
    <button id="export" type="button">Export progress</button>
    <label class="import">Import <input id="import" type="file" accept="application/json"></label>
  </div>
  <div id="rows"></div>
</section>
<section id="tab-roadmap" class="tab"><div id="roadmap"></div></section>
<section id="tab-missables" class="tab"><div id="missables"></div></section>
<section id="tab-sources" class="tab"><div id="sources"></div></section>
<footer>
  <p>All guides are written in our own words. Sources are cited, never copied. Sources read 20 Nov 2026.</p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
